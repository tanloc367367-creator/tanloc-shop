<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>TÂN LỘC SHOP - Bán Key</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; font-family:'Segoe UI',sans-serif; }
  body { background:linear-gradient(135deg,#0f0c29,#302b63,#24243e); color:#fff; min-height:100vh; }
  .hidden { display: none !important; }
  .topbar { display:flex; justify-content:space-between; align-items:center; padding:15px 20px; border-bottom:1px solid #333; max-width:1100px; margin:0 auto; }
  .logo { font-size:1.5rem; font-weight:800; background:linear-gradient(90deg,#00f2fe,#a855f7); -webkit-background-clip:text; -webkit-text-fill-color:transparent; }
  .brand { text-align:center; padding:30px 20px 10px; }
  .brand-name { font-size:2.5rem; font-weight:900; letter-spacing:2px; background:linear-gradient(90deg,#00f2fe,#4facfe,#a855f7,#00f2fe); background-size:300% auto; -webkit-background-clip:text; -webkit-text-fill-color:transparent; animation:shineBrand 4s linear infinite; line-height:1.2; }
  @keyframes shineBrand { to { background-position:300% center; } }
  .brand-sub { font-size:1rem; font-weight:700; color:#ffd700; letter-spacing:3px; margin-top:8px; text-transform:uppercase; }
  .grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(260px,1fr)); gap:20px; max-width:1100px; margin:30px auto; padding:0 20px; }
  .card { background:rgba(255,255,255,0.05); border:1px solid rgba(255,255,255,0.1); border-radius:20px; padding:25px; position:relative; }
  .card h3 { font-size:1.3rem; margin-bottom:10px; }
  .desc { color:#aaa; font-size:0.9rem; margin-bottom:15px; min-height:40px; }
  .price { font-size:1.8rem; font-weight:800; color:#00f2fe; margin-bottom:15px; }
  .stock { display:inline-block; padding:5px 12px; border-radius:20px; font-size:0.8rem; font-weight:700; margin-bottom:12px; }
  .btn { width:100%; padding:12px; border:none; border-radius:12px; background:linear-gradient(90deg,#4facfe,#00f2fe); color:#000; font-weight:700; font-size:1rem; cursor:pointer; }
  .btn-sm { width:auto; padding:6px 12px; font-size:0.8rem; margin:0 2px; }
  .tabs { display:flex; gap:10px; margin-bottom:20px; border-bottom:1px solid #333; overflow-x:auto; }
  .tab { padding:12px 20px; cursor:pointer; color:#aaa; border:none; background:none; white-space:nowrap; }
  .tab.active { color:#4facfe; border-bottom:2px solid #4facfe; }
  .panel { display:none; } .panel.active { display:block; }
  table { width:100%; border-collapse:collapse; background:rgba(255,255,255,0.03); }
  th,td { padding:12px; text-align:left; border-bottom:1px solid #222; font-size:0.88rem; vertical-align:middle; }
  th { background:rgba(79,172,254,0.15); color:#4facfe; }
  .modal { display:none; position:fixed; inset:0; background:rgba(0,0,0,0.9); z-index:1000; align-items:center; justify-content:center; }
  .modal.active { display:flex; }
  .modal-box { background:#1a1a2e; border-radius:20px; padding:30px; max-width:400px; width:100%; }
  .qr-wrap { background:#fff; padding:15px; border-radius:12px; text-align:center; margin:15px 0; }
  .qr-wrap img { width:200px; height:200px; }
  .toast { position:fixed; top:20px; right:20px; background:#1a1a2e; border:1px solid #4facfe; padding:15px; border-radius:12px; display:none; z-index:2000; }
  .toast.show { display:block; }
  input.admin-input { padding:8px; border-radius:6px; border:1px solid #444; background:#222; color:#fff; font-size:0.85rem; width:100%; max-width:300px; }
</style>
</head>
<body>

<!-- TRANG KHÁCH HÀNG -->
<div id="page-home">
  <div class="topbar"><div class="logo">🔑 TÂN LỘC</div></div>
  <div class="brand"><div class="brand-name">VOHOAINAM.NET</div><div class="brand-sub">SHOP BÁN KEY TANLOC!</div></div>
  <div class="grid" id="products-list"></div>
</div>

<!-- TRANG ADMIN (BÍ MẬT) -->
<div id="page-admin" class="hidden" style="padding:20px;max-width:1200px;margin:0 auto;">
  <div style="display:flex;justify-content:space-between;margin-bottom:20px; align-items:center;">
    <h1 style="color:#00f2fe;">⚙️ Admin Panel</h1>
    <a href="/" class="btn" style="width:auto;padding:10px 20px;background:#f5576c;color:#fff;text-decoration:none;">Thoát Admin</a>
  </div>
  
  <div class="tabs">
    <button class="tab active" onclick="showTab('orders',this)">🧾 Đơn hàng</button>
    <button class="tab" onclick="showTab('products',this)">📦 Quản lý Sản phẩm & Kho Key</button>
  </div>
  
  <div class="panel active" id="orders">
    <table><thead><tr><th>Mã ĐH</th><th>Sản phẩm</th><th>Key đã giao</th><th>Trạng thái</th><th>Hành động</th></tr></thead><tbody id="admin-order-body"></tbody></table>
  </div>
  
  <div class="panel" id="products">
    <h2 style="margin-bottom:15px; font-size:1.2rem;">Thêm sản phẩm mới</h2>
    <div style="background:rgba(255,255,255,0.05); padding:15px; border-radius:10px; margin-bottom:20px; display:flex; gap:10px; flex-wrap:wrap;">
      <input id="p-name" placeholder="Tên sản phẩm" class="admin-input" style="max-width:200px;">
      <input id="p-price" type="number" placeholder="Giá (đ)" class="admin-input" style="max-width:120px;">
      <button onclick="addProduct()" class="btn btn-sm" style="background:#00f2fe;">➕ Thêm SP</button>
    </div>

    <h2 style="margin-bottom:15px; font-size:1.2rem;">Danh sách sản phẩm & Thêm Key</h2>
    <table>
      <thead><tr><th>Tên SP</th><th>Giá</th><th>Còn lại</th><th>Thêm Key (cách nhau dấu phẩy)</th></tr></thead>
      <tbody id="admin-prod-body"></tbody>
    </table>
  </div>
</div>

<!-- MODAL THANH TOÁN -->
<div class="modal" id="pay-modal">
  <div class="modal-box">
    <h3 style="text-align:center;">Thanh toán</h3>
    <p id="pay-product" style="text-align:center;"></p>
    <p id="pay-amount" style="text-align:center;font-size:2rem;color:#00f2fe;"></p>
    <div class="qr-wrap"><img id="pay-qr"></div>
    <p style="text-align:center;font-size:0.9rem;">Nội dung CK: <b id="pay-memo" style="color:#ffd700; font-size:1.2rem;"></b></p>
    <p style="text-align:center; font-size:0.8rem; color:#aaa; margin-top:10px;">(Chuyển khoản xong, vui lòng nhắn Zalo để nhận Key)</p>
    <button class="btn" onclick="document.getElementById('pay-modal').classList.remove('active')" style="margin-top:15px; background:#555; color:#fff;">Đóng</button>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
// === CƠ CHẾ BẢO MẬT BẰNG LINK ===
// Nếu trên thanh địa chỉ có chứa #admintanlocdepzai thì sẽ mở trang Admin
const isAdmin = window.location.hash === '#admintanlocdepzai';

function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.classList.add('show'); setTimeout(()=>t.classList.remove('show'),3000); }

async function init() {
  if (isAdmin) {
    document.getElementById('page-home').classList.add('hidden');
    document.getElementById('page-admin').classList.remove('hidden');
    loadAdminOrders();
    loadAdminProducts();
  } else {
    document.getElementById('page-admin').classList.add('hidden');
    document.getElementById('page-home').classList.remove('hidden');
    loadProducts();
  }
}

// ================= TRANG KHÁCH HÀNG =================
async function loadProducts() {
  try {
    const r = await fetch('/api/products'); const list = await r.json();
    document.getElementById('products-list').innerHTML = list.map(p => `
      <div class="card">
        <h3>${p.name}</h3><p class="desc">${p.description||''}</p>
        <div class="price">${p.price.toLocaleString('vi-VN')}đ</div>
        <div class="stock" style="background:${p.stock>0?'#00f2fe22':'#f5576c22'};color:${p.stock>0?'#00f2fe':'#f5576c'}">${p.stock>0?`Còn ${p.stock} key`:'Hết key'}</div>
        <button class="btn" ${p.stock<=0?'disabled':''} onclick="buyKey(${p.id})">Mua ngay</button>
      </div>`).join('');
  } catch (e) { toast('Lỗi tải sản phẩm!'); }
}

async function buyKey(id) {
  try {
    const r = await fetch('/api/buy/'+id,{method:'POST'}); const d = await r.json();
    if(!r.ok) return toast(d.error);
    document.getElementById('pay-product').textContent = d.productName;
    document.getElementById('pay-amount').textContent = d.amount.toLocaleString('vi-VN')+'đ';
    document.getElementById('pay-memo').textContent = d.payment_code;
    document.getElementById('pay-qr').src = `https://img.vietqr.io/image/970422-0123456789-compact2.png?amount=${d.amount}&addInfo=${d.payment_code}`;
    document.getElementById('pay-modal').classList.add('active');
  } catch (e) { toast('Lỗi kết nối'); }
}

// ================= TRANG ADMIN =================
function showTab(id, btn) {
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('active'); btn.classList.add('active');
  if(id==='orders') loadAdminOrders(); 
  if(id==='products') loadAdminProducts(); 
}

async function loadAdminOrders() {
  try {
    const r = await fetch('/api/admin/orders'); const list = await r.json();
    document.getElementById('admin-order-body').innerHTML = list.map(o=>`<tr><td><b style="color:#ffd700">${o.payment_code}</b></td><td>${o.product_name}</td><td style="color:#00f2fe; font-family:monospace;">${o.key_value||'-'}</td><td>${o.status}</td><td>${o.status==='pending'?`<button onclick="approve(${o.id})" class="btn btn-sm" style="background:#00f2fe;">Duyệt</button>`:''}</td></tr>`).join('');
  } catch (e) { toast('Lỗi tải đơn hàng'); }
}

async function approve(id) { 
  await fetch('/api/admin/orders/'+id+'/approve',{method:'POST'}); 
  loadAdminOrders(); toast('Đã duyệt đơn!'); 
}

async function loadAdminProducts() {
  try {
    const r = await fetch('/api/products'); const list = await r.json();
    document.getElementById('admin-prod-body').innerHTML = list.map(p=>`
      <tr>
        <td>${p.name}</td>
        <td>${p.price.toLocaleString('vi-VN')}đ</td>
        <td><b style="color:${p.stock>0?'#00f2fe':'#f5576c'}">${p.stock}</b></td>
        <td>
          <div style="display:flex; gap:5px;">
            <input type="text" id="key-input-${p.id}" class="admin-input" placeholder="Nhập danh sách key...">
            <button onclick="addKeyInline(${p.id})" class="btn btn-sm" style="background:#00f2fe; white-space:nowrap;">Thêm</button>
          </div>
        </td>
      </tr>
    `).join('');
  } catch (e) { toast('Lỗi tải sản phẩm'); }
}

async function addKeyInline(productId) {
  const input = document.getElementById('key-input-' + productId);
  const raw = input.value.trim();
  if(!raw) return toast('Vui lòng nhập key!');
  
  const keys = raw.split(',').map(k => k.trim()).filter(Boolean);
  let success = 0;
  for (const key_value of keys) {
    const res = await fetch('/api/admin/keys', {
      method: 'POST', headers: {'Content-Type': 'application/json'},
      body: JSON.stringify({ product_id: productId, key_value })
    });
    if(res.ok) success++;
  }
  toast(`✅ Đã thêm ${success} key vào kho!`);
  input.value = ''; loadAdminProducts(); 
}

async function addProduct() {
  const name = document.getElementById('p-name').value;
  const price = +document.getElementById('p-price').value;
  if (!name || !price) return toast('Nhập tên và giá!');
  
  await fetch('/api/admin/products',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name,price,description:'',badge:''})});
  loadAdminProducts(); toast('Đã thêm sản phẩm'); 
  document.getElementById('p-name').value=''; document.getElementById('p-price').value='';
}

init();
</script>
</body>
</html>
