<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Admin - TÂN LỘC SHOP</title>
<style>
*{margin:0;padding:0;box-sizing:border-box;font-family:'Segoe UI',sans-serif;}
body{background:#0f0c29;color:#fff;min-height:100vh;padding:20px;}
.container{max-width:1200px;margin:0 auto;}
h1{background:linear-gradient(90deg,#00f2fe,#a855f7);-webkit-background-clip:text;-webkit-text-fill-color:transparent;margin-bottom:20px;font-size:2rem;}
.tabs{display:flex;gap:10px;margin-bottom:20px;border-bottom:1px solid #333;flex-wrap:wrap;}
.tab{padding:12px 20px;cursor:pointer;color:#aaa;border:none;background:none;font-size:1rem;}
.tab.active{color:#4facfe;border-bottom:2px solid #4facfe;}
.panel{display:none;}
.panel.active{display:block;}

/* Stats */
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:15px;margin-bottom:20px;}
.stat{background:rgba(255,255,255,0.05);padding:20px;border-radius:15px;border:1px solid #333;}
.stat .label{color:#aaa;font-size:.85rem;margin-bottom:8px;}
.stat .value{font-size:1.8rem;font-weight:800;background:linear-gradient(90deg,#00f2fe,#4facfe);-webkit-background-clip:text;-webkit-text-fill-color:transparent;}

/* Table */
table{width:100%;border-collapse:collapse;background:rgba(255,255,255,0.03);border-radius:12px;overflow:hidden;}
th,td{padding:12px;text-align:left;border-bottom:1px solid #222;font-size:.88rem;}
th{background:rgba(79,172,254,0.15);color:#4facfe;}
tr:hover td{background:rgba(79,172,254,0.05);}

button{padding:8px 14px;border:none;border-radius:8px;background:linear-gradient(90deg,#4facfe,#00f2fe);color:#000;font-weight:700;cursor:pointer;font-size:.85rem;margin:2px;}
button.danger{background:linear-gradient(90deg,#f5576c,#f093fb);color:#fff;}
button.warning{background:linear-gradient(90deg,#ffa500,#ffd700);color:#000;}

.act-btn{padding:6px 10px;border-radius:6px;font-size:.8rem;font-weight:600;}
.act-view{background:#4facfe;color:#000;}
.act-grant{background:#a855f7;color:#fff;}
.act-ban{background:#f5576c;color:#fff;}
.act-unban{background:#00f2fe;color:#000;}
.role-tag{padding:3px 10px;border-radius:20px;font-size:.75rem;font-weight:700;}
.role-super{background:linear-gradient(90deg,#ffd700,#ff8c00);color:#000;}
.role-admin{background:linear-gradient(90deg,#a855f7,#f093fb);color:#fff;}
.role-user{background:#333;color:#aaa;}
.toast{position:fixed;top:20px;right:20px;background:#1a1a2e;border:1px solid #4facfe;padding:15px 20px;border-radius:12px;display:none;z-index:200;}
.toast.show{display:block;}
</style>
</head>
<body>
<div class="container">
  <div style="display:flex;justify-content:space-between;align-items:center;">
    <h1>⚙️ Admin Panel</h1>
    <div>
      <a href="/" style="color:#4facfe;text-decoration:none;margin-right:15px;">← Về trang chủ</a>
      <button onclick="logout()" class="danger">Đăng xuất</button>
    </div>
  </div>

  <div class="tabs">
    <button class="tab active" onclick="showTab('dash',this)">📊 Tổng quan</button>
    <button class="tab" onclick="showTab('orders',this)">🧾 Đơn hàng</button>
    <button class="tab" onclick="showTab('users',this)">👥 Người dùng</button>
  </div>

  <div class="panel active" id="dash">
    <div class="stats" id="statsBox"></div>
  </div>

  <div class="panel" id="orders">
    <h2 style="margin-bottom:15px;color:#4facfe;">🧾 Đơn hàng mới nhất</h2>
    <table>
      <thead><tr><th>ID</th><th>User</th><th>Sản phẩm</th><th>Mã CK</th><th>Số tiền</th><th>Key</th><th>Trạng thái</th><th>Hành động</th></tr></thead>
      <tbody id="orderBody"></tbody>
    </table>
  </div>

  <div class="panel" id="users">
    <h2 style="margin-bottom:15px;color:#4facfe;">👥 Quản lý Người dùng</h2>
    <table>
      <thead><tr><th>ID</th><th>Tên</th><th>Email</th><th>Vai trò</th><th>Trạng thái</th><th>Ngày tạo</th><th>Hành động</th></tr></thead>
      <tbody id="userBody"></tbody>
    </table>
  </div>
</div>

<div class="toast" id="toast"></div>

<script>
let currentUser = null;

async function init() {
  const r = await fetch('/api/me');
  if (!r.ok) { location.href = '/login.html'; return; }
  currentUser = await r.json();
  if (!['admin','super'].includes(currentUser.role)) {
    alert('Bạn không có quyền vào trang này'); location.href = '/'; return;
  }
  loadStats(); loadOrders(); loadUsers();
}
init();

function toast(m) {
  const t = document.getElementById('toast');
  t.textContent = m; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2500);
}

function showTab(id, btn) {
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(b=>b.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  btn.classList.add('active');
  if (id==='users') loadUsers();
  if (id==='orders') loadOrders();
}

async function logout(){ await fetch('/api/logout',{method:'POST'}); location.href='/'; }

async function loadStats() {
  const r = await fetch('/api/admin/stats');
  const s = await r.json();
  document.getElementById('statsBox').innerHTML = `
    <div class="stat"><div class="label">👥 Người dùng</div><div class="value">${s.users}</div></div>
    <div class="stat"><div class="label">📦 Sản phẩm</div><div class="value">${s.products}</div></div>
    <div class="stat"><div class="label">🔑 Key còn</div><div class="value">${s.keysAvailable}</div></div>
    <div class="stat"><div class="label">🧾 Tổng đơn</div><div class="value">${s.orders}</div></div>
    <div class="stat"><div class="label">💰 Doanh thu</div><div class="value">${s.revenue.toLocaleString('vi-VN')}đ</div></div>
  `;
}

async function loadOrders() {
  const r = await fetch('/api/admin/orders');
  const list = await r.json();
  const statusMap = {
    pending: '<span style="color:#ffa500">⏳ Chờ CK</span>',
    waiting: '<span style="color:#4facfe">🔄 Chờ duyệt</span>',
    paid: '<span style="color:#00f2fe">✅ Đã giao</span>',
    cancelled: '<span style="color:#f5576c">❌ Đã hủy</span>',
  };
  document.getElementById('orderBody').innerHTML = list.map(o => {
    let actions = '';
    if (o.status === 'waiting') {
      actions = `<button class="act-btn act-unban" onclick="approveOrder(${o.id})">✅ Duyệt</button>
                 <button class="act-btn act-ban" onclick="cancelOrder(${o.id})">❌ Hủy</button>`;
    } else if (o.status === 'pending') {
      actions = `<button class="act-btn act-ban" onclick="cancelOrder(${o.id})">❌ Hủy</button>`;
    } else { actions = '<span style="color:#555">—</span>'; }
    return `<tr>
      <td>#${o.id}</td><td>${o.username}</td><td>${o.product_name}</td>
      <td><code style="color:#ffd700">${o.payment_code||'-'}</code></td>
      <td>${o.amount.toLocaleString('vi-VN')}đ</td>
      <td style="font-family:monospace;color:#00f2fe">${o.key_value||'-'}</td>
      <td>${statusMap[o.status]||o.status}</td><td>${actions}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="8" style="text-align:center;color:#888;padding:30px">Chưa có đơn hàng</td></tr>`;
}

async function approveOrder(id) {
  if (!confirm(`Duyệt đơn #${id} và GIAO KEY?`)) return;
  const r = await fetch('/api/admin/orders/'+id+'/approve', {method:'POST'});
  const d = await r.json();
  if (r.ok) { toast('✅ Đã duyệt! Key: '+d.key); loadOrders(); loadStats(); }
  else toast('❌ '+d.error);
}

async function cancelOrder(id) {
  if (!confirm(`Hủy đơn #${id}?`)) return;
  const r = await fetch('/api/admin/orders/'+id+'/cancel', {method:'POST'});
  if (r.ok) { toast('✅ Đã hủy'); loadOrders(); loadStats(); }
}

async function loadUsers() {
  const r = await fetch('/api/admin/users');
  const list = await r.json();
  document.getElementById('userBody').innerHTML = list.map(u => {
    const roleTag = {
      super: '<span class="role-tag role-super">👑 Super</span>',
      admin: '<span class="role-tag role-admin">⚙️ Admin</span>',
      user: '<span class="role-tag role-user">👤 User</span>'
    }[u.role] || u.role;
    const statusTag = u.status === 'banned' ? '<span style="color:#f5576c">🔒 Khóa</span>' : '<span style="color:#00f2fe">🟢 Active</span>';
    let actions = '';
    if (currentUser.role === 'super' && u.role !== 'super') {
      if (u.role === 'user') actions += `<button class="act-btn act-grant" onclick="grant(${u.id},'admin')">⬆️ Cấp Admin</button>`;
      else actions += `<button class="act-btn act-ban" onclick="grant(${u.id},'user')">⬇️ Thu quyền</button>`;
    }
    if (u.role !== 'super' && (currentUser.role === 'super' || u.role !== 'admin')) {
      if (u.status === 'banned') actions += `<button class="act-btn act-unban" onclick="toggleBan(${u.id})">🔓 Mở khóa</button>`;
      else actions += `<button class="act-btn act-ban" onclick="toggleBan(${u.id})">🔒 Khóa</button>`;
    }
    return `<tr>
      <td>${u.id}</td><td>${u.username}</td><td style="color:#4facfe">${u.email||'-'}</td>
      <td>${roleTag}</td><td>${statusTag}</td><td>${u.created_at}</td><td>${actions || '—'}</td>
    </tr>`;
  }).join('');
}

async function grant(id, role) {
  if (!confirm(`Đổi quyền user này thành ${role}?`)) return;
  const r = await fetch('/api/admin/grant/'+id, {method:'POST', headers:{'Content-Type':'application/json'}, body: JSON.stringify({role})});
  if (r.ok) { toast('✅ Cập nhật quyền'); loadUsers(); }
  else { const d = await r.json(); toast('❌ '+d.error); }
}

async function toggleBan(id) {
  const r = await fetch('/api/admin/ban/'+id, {method:'POST'});
  if (r.ok) { loadUsers(); toast('✅ Cập nhật trạng thái'); }
  else { const d = await r.json(); toast('❌ '+d.error); }
}
</script>
</body>
</html>
