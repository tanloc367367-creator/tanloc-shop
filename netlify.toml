[build]
  command = "echo Building Functions"
  functions = "netlify/functions"
  publish = "public"

[functions]
  external_node_modules = ["express", "@libsql/client"]
  node_bundler = "esbuild"

[[redirects]]
  from = "/api/*"
  to = "/.netlify/functions/api/:splat"
  status = 200
  force = true

[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200
